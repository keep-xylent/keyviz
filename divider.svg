<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3" width="100%" height="3">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="25%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#F5A623" />
      <stop offset="75%" stop-color="#41CD52" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="3" fill="url(#gradient)">
    <animateTransform 
      attributeName="gradientTransform" 
      type="translate" 
      values="0,0; 1200,0" 
      keyTimes="0; 1"
      dur="4s" 
      repeatCount="indefinite" />
  </rect>
</svg>
